<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Title 18 | Value-Engineering Simulator</title>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --text: #1e293b; --card: #ffffff; }
        body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 2rem; max-width: 1000px; margin: auto; }
        .dashboard-header { margin-bottom: 2rem; }
        .grid { display: grid; grid-template-columns: 300px 1fr; gap: 1.5rem; }
        .card { background: var(--card); padding: 1.5rem; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        h2 { font-size: 1rem; color: #64748b; text-transform: uppercase; margin-bottom: 1rem; }
        
        /* Inputs */
        input, select { width: 100%; padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 6px; margin-bottom: 1rem; }
        
        /* Metrics */
        .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-top: 1rem; }
        .metric-box { background: #f1f5f9; padding: 1rem; border-radius: 8px; text-align: center; }
        .metric-val { font-size: 1.25rem; font-weight: 700; color: var(--primary); }
        
        /* Requirements */
        .req-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.75rem; margin-top: 1rem; }
        .req-item { padding: 0.75rem; border-radius: 6px; background: #eff6ff; border: 1px solid #dbeafe; font-size: 0.85rem; }
    </style>
</head>
<body>

    <header class="dashboard-header">
        <h1>Title 18 Value-Engineering Simulator</h1>
        <p>Analyze the impact of proposed IBC amendments on project capital expenditures.</p>
    </header>

    <div class="grid">
        <aside class="card">
            <h2>Parameters</h2>
            <label>Target Unit Count</label>
            <input type="number" id="units" value="12" oninput="calculate()">
            
            <label>Compliance Pathway</label>
            <select id="pathway" onchange="calculate()">
                <option value="irc">IRC Small Multifamily (≤8)</option>
                <option value="title18" selected>Title 18 Single-Stair (9-16)</option>
                <option value="ibc_trans">IBC Transition (9-16)</option>
                <option value="ibc_full">Full IBC Compliance (17+)</option>
            </select>
        </aside>

        <main>
            <div class="card">
                <h2>Triggered Code Interdependencies</h2>
                <div class="req-grid" id="reqs"></div>
            </div>

            <div class="card" style="margin-top: 1.5rem;">
                <h2>Financial Summary</h2>
                <div class="metrics">
                    <div class="metric-box"><h3>IBC Baseline</h3><div id="baseline" class="metric-val">$0</div></div>
                    <div class="metric-box"><h3>Proposed Cost</h3><div id="projected" class="metric-val">$0</div></div>
                    <div class="metric-box"><h3>Capital Saved</h3><div id="savings" class="metric-val" style="color:#16a34a">$0</div></div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const data = {
            irc: { mult: 0.45, reqs: {"Sprinklers": "None", "Egress": "1 Stair", "Fire Rating": "1-Hr", "Travel": "75 ft"} },
            title18: { mult: 0.55, reqs: {"Sprinklers": "NFPA 13D", "Egress": "1 Stair", "Fire Rating": "1-Hr", "Travel": "125 ft"} },
            ibc_trans: { mult: 0.75, reqs: {"Sprinklers": "NFPA 13R", "Egress": "2 Stairs", "Fire Rating": "0.5-Hr", "Travel": "125 ft"} },
            ibc_full: { mult: 1.00, reqs: {"Sprinklers": "NFPA 13", "Egress": "2+ Stairs", "Fire Rating": "2-Hr", "Travel": "150 ft"} }
        };

        function calculate() {
            const units = parseInt(document.getElementById('units').value);
            const path = document.getElementById('pathway').value;
            const config = data[path];
            const baseline = units * 180000;
            const cost = baseline * config.mult;
            
            document.getElementById('baseline').innerText = '$' + baseline.toLocaleString();
            document.getElementById('projected').innerText = '$' + Math.round(cost).toLocaleString();
            document.getElementById('savings').innerText = '$' + Math.round(baseline - cost).toLocaleString();
            
            document.getElementById('reqs').innerHTML = Object.entries(config.reqs).map(([k, v]) => 
                `<div class="req-item"><strong>${k}</strong><br>${v}</div>`).join('');
        }
        calculate();
    </script>
</body>
</html>
